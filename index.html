
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VaiPet</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700;800;900&display=swap" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="VAIPET é o melhor app para passeio e cuidados com seus pets. Encontre passeadores, veterinários, petshops e serviços de hotelaria para seu animal de estimação.">
    <meta name="keywords" content="passeio de pets, cuidados animais, veterinário, petshop, hotelaria pets, app pets, passeador de cães, VAIPET" />
    <meta name="author" content="VAIPET Team" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="pt-BR" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vaipet.lovable.app/" />
    
    
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/RoAoQPxf0ogyxnKM2ONwdAgxTwf1/social-images/social-1781539759493-web.webp">
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://vaipet.lovable.app/" />
    
    
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/RoAoQPxf0ogyxnKM2ONwdAgxTwf1/social-images/social-1781539759493-web.webp">
    <meta name="twitter:site" content="@vaipet_app" />
    
    <!-- iOS specific meta tags for native app feel.
         status-bar-style=black-translucent faz o conteúdo passar POR BAIXO
         da ilha/bateria (sem mais barra branca no topo); o tema escuro do
         próprio app preenche essa área. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VAIPET">
    <!-- theme-color reage à preferência claro/escuro do sistema -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    
    <!-- Prevent zoom on iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
  
  
  
  <meta property="og:title" content="VaiPet">
  <meta name="twitter:title" content="VaiPet">
  <meta property="og:description" content="VAIPET é o melhor app para passeio e cuidados com seus pets. Encontre passeadores, veterinários, petshops e serviços de hotelaria para seu animal de estimação.">
  <meta name="twitter:description" content="VAIPET é o melhor app para passeio e cuidados com seus pets. Encontre passeadores, veterinários, petshops e serviços de hotelaria para seu animal de estimação.">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
